  <script>
    (function () {
      const TM = window.TM, VO = window.VO, S0 = TM.s2[0];
      const W = KIT.W(S0), F = (t) => t - S0, END = (k) => F(VO[k].end);

      // the board's parts (cards, the spec, the five load rules, the screenshots, the wires) are a table in assets/board-parts.js
      const WR = window.BOARD_PARTS();

      // ---- camera: frame world point (cx, cy) at zoom s in the screen area between the two bands (y 100..916)
      const cam = document.getElementById("b-cam");
      const C = (cx, cy, s) => ({ x: 960 - cx * s, y: 508 - cy * s, scale: s });
      const tl = gsap.timeline({ paused: true });
      const m = KIT.moves(tl);
      const A = (id) => `#a-${id}`;
      const move = (t, cx, cy, s, d = 1.3) => tl.to(cam, { ...C(cx, cy, s), duration: d, ease: "power2.inOut" }, t);
      const wire = (id, at, d) => m.wire(WR[id], at, d);
      const dim = (sel, at, v) => tl.to(sel, { opacity: v, duration: 0.8, ease: "power1.inOut" }, at);
      const HL = "rgba(0, 136, 255, 0.16)", HL0 = "rgba(0, 136, 255, 0)", RD = "rgba(255, 56, 60, 0.12)", RD0 = "rgba(255, 56, 60, 0)";

      // everything starts hidden; each part arrives on its word
      gsap.set(["claude", "csv", "spec", "comp", "hyper", "checks", "pkg", "val", "tab", "rules", "public", "pub", "guard", "refuse", "tests"].map(A), { opacity: 0 });
      gsap.set(["#a-sec-who", "#a-sec-pub", "#a-zB", "#a-zB-l", "#a-zC", "#a-zC-l", "#w-dash", "#w-map", "#w-bar", ".w-cap", "#a-wl-public"], { opacity: 0 });
      gsap.set([".a-st", ".a-chips", ".a-note", ".j-l", "#v-err > *", "#v-chips .a-chip", ".r-row", ".r-ok", "#j-typo", ".t-big", "#t-det"], { opacity: 0 });

      // ===== s2: describe a workbook in JSON; the dry run catches a typo, with the right names =====
      tl.fromTo("#b-fade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
      tl.fromTo(cam, C(436, 370, 1.58), { ...C(436, 370, 1.5), duration: F(TM.s3[0]) - 0.1, ease: "none" }, 0);
      m.fade("#a-sec-who", 0.25, 0.4);
      m.pop(A("claude"), 0.35);
      m.fade("#a-zB", 0.45, 0.6);
      m.fade("#a-zB-l", 0.65);
      m.ph(A("val"), 0.75);
      wire("w-claude", 0.95);
      m.ph(A("spec"), W("v04", "describe") - 0.1);
      m.light(A("spec"), W("v04", "json") - 0.05);
      const jOpen = W("v04", "json") + 0.25;
      tl.to(A("spec"), { height: 374, duration: 0.6, ease: "power2.inOut" }, jOpen);
      tl.fromTo(".j-l", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", stagger: 0.05 }, jOpen + 0.2);
      wire("w-spec", W("v05", "dry") - 0.3);
      m.light(A("val"), W("v05", "dry"));
      // "checks every field against the data": the three field names are looked up in turn
      ["#j-f1", "#j-f2", "#j-f3"].forEach((s, i) => tl.to(s, { backgroundColor: HL, duration: 0.25, ease: "power1.out" }, W("v05", ["every", "field", "against"][i])));
      tl.to(["#j-f1", "#j-f2", "#j-f3"], { backgroundColor: HL0, duration: 0.35, ease: "power1.inOut" }, W("v05", "data") + 0.25);
      // "so a typo": Status becomes Stauts; "fails": the dry run opens its real error; "with the right names": the field list
      const ty = W("v05", "typo");
      tl.to("#j-ok", { opacity: 0, duration: 0.2 }, ty);
      tl.to("#j-typo", { opacity: 1, duration: 0.2 }, ty);
      tl.to("#j-f2", { backgroundColor: RD, duration: 0.25 }, ty);
      const fl = W("v05", "fails") - 0.1;
      tl.to(A("val"), { height: 377, duration: 0.55, ease: "power2.inOut" }, fl);
      tl.fromTo("#v-err > *:not(#v-chips)", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.08 }, fl + 0.2);
      tl.set("#v-chips", { opacity: 1 }, fl + 0.2);
      m.dot("#v-st-err", fl + 0.15);
      tl.fromTo("#v-chips .a-chip", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.035 }, W("v05", "right") - 0.05);
      tl.to("#v-chip-status", { backgroundColor: HL, duration: 0.3, ease: "power1.out" }, W("v05", "names") + 0.15);
      // fixed: Status again, the error folds away, the dry run says valid
      const fx = END("v05") + 0.3;
      tl.to("#j-typo", { opacity: 0, duration: 0.2 }, fx);
      tl.to("#j-ok", { opacity: 1, duration: 0.2 }, fx);
      tl.to("#j-f2", { backgroundColor: RD0, duration: 0.3 }, fx);
      tl.to("#v-err", { opacity: 0, duration: 0.35, ease: "power1.inOut" }, fx);
      tl.to(A("val"), { height: 116, duration: 0.42, ease: "power2.inOut" }, fx);
      m.out("#v-st-err", fx, 0.12);
      m.dot("#v-st-ok", fx + 0.1);

      // ===== s3: the compiler writes the workbook; each CSV becomes the Hyper extract Tableau Public requires =====
      const T3 = F(TM.s3[0]);
      move(T3, 436, 500, 1.6);
      tl.to(A("spec"), { height: 96, duration: 0.55, ease: "power2.inOut" }, T3 + 0.05);
      m.out("#j-block", T3, 0.2);
      ["comp", "hyper", "checks", "pkg"].forEach((id, i) => m.ph(A(id), T3 + 0.2 + i * 0.07));
      m.ph(A("csv"), T3 + 0.3);
      wire("w-v1", W("v06", "compiler") - 0.25, 0.25);
      m.light(A("comp"), W("v06", "compiler"));
      m.dot("#a-comp-st1", W("v06", "workbook"));
      m.light(A("csv"), W("v06", "each") - 0.05);
      wire("w-csv", W("v06", "csv"), 0.35);
      wire("w-v2", W("v06", "into") - 0.1, 0.25);
      m.light(A("hyper"), W("v06", "hyper") - 0.05);
      m.dot("#a-hyper-st1", W("v06", "hyper") + 0.45);
      move(W("v06", "tableau") + 0.1, 436, 646, 1.6);
      m.fade("#a-hyper-note", W("v06", "requires") - 0.05, 0.45);
      wire("w-v3", END("v06") - 0.75, 0.25);
      m.light(A("checks"), END("v06") - 0.55);
      m.dot("#a-checks-st1", END("v06") - 0.15);
      wire("w-v4", END("v06") - 0.3, 0.25);
      m.light(A("pkg"), END("v06") - 0.1);
      tl.set("#a-pkg-chips", { opacity: 1 }, END("v06") + 0.05);
      m.chips("#a-pkg-chips .a-chip", END("v06") + 0.05);
      m.dot("#a-pkg-st1", END("v06") + 0.35);

      // ===== s4: it opens the file in the real Tableau Public app and photographs it; five load rules; the screenshots =====
      const T4 = F(TM.s4[0]), M4 = T4 + 0.3;
      dim(["#g-A", "#g-B"], M4 + 0.1, 0.22);
      move(M4, 1154, 322, 1.75, 1.4);
      m.fade("#a-zC", M4 + 0.2, 0.6);
      m.fade("#a-zC-l", M4 + 0.4);
      m.ph(A("tab"), M4 + 0.45);
      m.ph(A("rules"), M4 + 0.75);
      wire("w-pkg", W("v07", "opens"), 0.7);
      m.light(A("tab"), W("v07", "tableau") - 0.05);
      m.dot("#a-tab-st1", W("v07", "app") - 0.05);
      m.dot("#a-tab-st2", W("v07", "and") + 0.1);
      m.dot("#a-tab-st3", W("v07", "photographs"));
      m.light(A("rules"), W("v08", "five"));
      tl.fromTo(".r-row", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.16 }, W("v08", "load") - 0.55);
      const rf = W("v08", "only");
      [1, 2, 3, 4, 5].forEach((n, i) => {
        tl.to(`.r-row:nth-child(${n}) .r-x`, { opacity: 0, duration: 0.2 }, rf + i * 0.18);
        tl.fromTo(`.r-row:nth-child(${n}) .r-ok`, { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, rf + i * 0.18);
      });
