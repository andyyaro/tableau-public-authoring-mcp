  </style>
  <div id="h-root" data-composition-id="s1-hook" data-width="1920" data-height="1080">

    <div id="h-c1" class="h-card">
      <div class="h-tile"><svg class="ic"><use href="#ic-globe" /></svg></div>

  </div>
  <script>
    (function () {
      const TM = window.TM, VO = window.VO;
      const S0 = TM.s1[0], S1 = TM.s1[1];
      const W = KIT.W(S0); // the voice's own word times (window.VO), in this scene's local seconds
      const F = (t) => t - S0;
      const tl = gsap.timeline({ paused: true });
      // placeholder: the empty card arrives faint, its content lights up on the word that names it (CERFODES)
      const ph = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.97 }, { opacity: 0.5, scale: 1, duration: 0.45, ease: "power2.out" }, at);
      const light = (sel, at) => {
        tl.to(sel, { opacity: 1, duration: 0.3, ease: "power1.out" }, at);
        tl.fromTo(`${sel} > *`, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, at);
        tl.to(sel, { scale: 1.035, duration: 0.2, ease: "power2.out" }, at);
        tl.to(sel, { scale: 1, duration: 0.35, ease: "power2.inOut" }, at + 0.2);
      };
      const dot = (sel, at) => tl.fromTo(sel, { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, at);

      gsap.set(["#h-c1 > *", "#h-c2 > *", "#h-c1-st", "#h-c2-st", "#h-c1", "#h-c2", "#h-head"], { opacity: 0 });
      gsap.set(["#h-ground", "#h-word", "#h-chip"], { opacity: 0 });
      gsap.set(["#h-br1", "#h-br2"], { strokeDasharray: 1, strokeDashoffset: 1 });
      gsap.set(".bar", { scaleY: 0 });
      gsap.set(["#h-br1", "#h-br2"], { opacity: 0 }); // a zero-length round-capped stroke still draws a dot

      tl.fromTo("#h-head", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.15);
      ph("#h-c1", 0.3);
      ph("#h-c2", 0.42);
      light("#h-c1", W("v01", "publishing") - 0.05);
      dot("#h-c1-st", W("v01", "api") + 0.05);
      light("#h-c2", W("v02", "library") - 0.05);
      dot("#h-c2-st", W("v02", "scratch") - 0.05);

      // the drop: the two gaps step away, the icon builds (ground, the two braces draw, the three bars rise)
      const D = F(TM.drop);
      tl.to(["#h-c1", "#h-c2", "#h-head"], { opacity: 0, y: -10, duration: 0.35, ease: "power1.in" }, D - 0.4);
      tl.fromTo("#h-ground", { opacity: 0, scale: 0.86, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.4)" }, D);
      tl.set(["#h-br1", "#h-br2"], { opacity: 1 }, D + 0.18);
      tl.to(["#h-br1", "#h-br2"], { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, D + 0.18);
      ["#h-b1", "#h-b2", "#h-b3"].forEach((b, i) => tl.to(b, { scaleY: 1, duration: 0.45, ease: "back.out(1.6)" }, D + 0.42 + i * 0.12));
      tl.fromTo("#h-word", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, W("v03", "public") + 0.05);
      tl.fromTo("#h-chip", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, W("v03", "publishes"));
      tl.to("#h-stack", { opacity: 0, duration: 0.35, ease: "power1.in" }, S1 - S0 - 0.4);
      window.__timelines["s1-hook"] = tl;
    })();
  </script>
