[project]
name = "tableau-public-authoring"
version = "0.1.0"
description = "MCP server that authors Tableau workbooks, validates them in Tableau Public, and publishes via the visible desktop workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andy Yaro" }]
dependencies = [
    "mcp>=1.28.0",
    "jsonschema>=4.23.0",
    # Tableau Public refuses any workbook that is not extract-backed (Error Code
    # 3C242D89), so compiler/extract.py materialises every CSV into a .hyper and
    # there is no build path that does not need this. It is a runtime dependency
    # of the server, not a test-only one; it was previously declared nowhere and
    # arrived via a separate `uv pip install` line in the README, which made
    # `uv sync && uv run pytest` fail on a clean checkout.
    # Floor = the version this project has actually been verified against.
    "tableauhyperapi>=0.0.25080",
    # RUNTIME, not test-only. Window discovery, the publish flow and every
    # screenshot go through CoreGraphics; see desktop/window_control.py and
    # publishing/publisher.py. It lived in the dev group, which made the server
    # *silently* half-dead when installed for real use: quartz_windows() catches
    # the ImportError and returns [], so Tableau appears to have no windows and
    # validation and publishing fail with "no document window matching ...".
    # The marker keeps a non-macOS resolve working; the server is macOS-only
    # anyway because it drives the desktop app.
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
tableau-public-authoring = "tableau_public_authoring.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tableau_public_authoring"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live tier drives a real GUI and must never run by accident - a bare
# `pytest` would otherwise launch Tableau. This is the FIRST of the two
# mechanisms that stop it; the second is tests/live/conftest.py, which catches
# what a marker filter structurally cannot (a test in tests/live/ that nobody
# marked). Change this line and change DEFAULT_MARKEXPR there to match - a unit
# test pins both.
# Override with `pytest -m live` (a CLI -m wins over this one) or by setting
# TABLEAU_LIVE_TESTS=1.
addopts = "-m 'not live'"
markers = [
    "live: requires Tableau Public installed (not for CI)",
    "publish: publishes to the real Tableau Public (never in CI)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
