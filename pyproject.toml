[project]
name = "tableau-public-authoring"
version = "0.1.0"
description = "MCP server that authors Tableau workbooks, validates them in Tableau Public, and publishes via the visible desktop workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andy Yaro" }]
dependencies = [
    "mcp>=1.28.0",
    "jsonschema>=4.23.0",
]

[project.scripts]
tableau-public-authoring = "tableau_public_authoring.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tableau_public_authoring"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live tier drives a real GUI and must never run by accident - a bare
# `pytest` would otherwise launch Tableau. Override with `pytest -m live`
# (a CLI -m wins over this one).
addopts = "-m 'not live'"
markers = [
    "live: requires Tableau Public installed (not for CI)",
    "publish: publishes to the real Tableau Public (never in CI)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
